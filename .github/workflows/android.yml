name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # CI 上直接使用官方仓库，跳过阿里云镜像（镜像偶发 502 会导致构建失败）
      SKIP_ALIYUN: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Detected app version: ${VERSION_NAME}"

      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AutoTapper-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Rolling Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          TAG_NAME="debug-latest"
          RELEASE_TITLE="AutoTapper v${VERSION_NAME} (debug)"
          RELEASE_NOTES="Automated debug APK for commit ${GITHUB_SHA:0:7}.
          Version: ${VERSION_NAME}
          Download: AutoTapper-debug.apk"
          APK_PATH="app/build/outputs/apk/debug/AutoTapper-debug.apk"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          fi

          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest
