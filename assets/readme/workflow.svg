<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="title desc">
  <title id="title">AutoTapper 工作原理</title>
  <desc id="desc">取点、配置、开始、循环点击、更新提醒五个步骤。</desc>

  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C111B"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="7" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF9A4D"/>
    </marker>
    <clipPath id="frameClip2">
      <rect width="1200" height="250" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip2)">
    <rect width="1200" height="250" fill="url(#bgGrad2)"/>
  </g>

  <!-- 节点连线 -->
  <g stroke="#FF7A1A" stroke-opacity="0.45" stroke-width="2.5"
     stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#flowArrow)">
    <line x1="184" y1="100" x2="322" y2="100"/>
    <line x1="414" y1="100" x2="552" y2="100"/>
    <line x1="644" y1="100" x2="782" y2="100"/>
    <line x1="874" y1="100" x2="1012" y2="100"/>
  </g>

  <!-- 步骤 1：取点 -->
  <g transform="translate(140 100)">
    <circle r="38" fill="#131B2A" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="27" cy="-27" r="13" fill="#FF7A1A"/>
    <text x="27" y="-22" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="15" font-weight="700" fill="#0C111B">1</text>
    <circle r="10" fill="none" stroke="#FF7A1A" stroke-width="3.5"/>
    <g stroke="#FF7A1A" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-16" x2="0" y2="-10"/><line x1="0" y1="10" x2="0" y2="16"/>
      <line x1="-16" y1="0" x2="-10" y2="0"/><line x1="10" y1="0" x2="16" y2="0"/>
    </g>
    <text y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="23" font-weight="700" fill="#E6EDF3">取点</text>
    <text y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="16" fill="#8B949E">轻触屏幕记录点位</text>
  </g>

  <!-- 步骤 2：配置 -->
  <g transform="translate(370 100)">
    <circle r="38" fill="#131B2A" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="27" cy="-27" r="13" fill="#FF7A1A"/>
    <text x="27" y="-22" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="15" font-weight="700" fill="#0C111B">2</text>
    <g stroke="#FF7A1A" stroke-width="3.5" stroke-linecap="round">
      <line x1="-15" y1="-8" x2="15" y2="-8"/>
      <line x1="-15" y1="8" x2="15" y2="8"/>
    </g>
    <circle cx="-5" cy="-8" r="5.5" fill="#0C111B" stroke="#FF7A1A" stroke-width="3"/>
    <circle cx="7" cy="8" r="5.5" fill="#0C111B" stroke="#FF7A1A" stroke-width="3"/>
    <text y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="23" font-weight="700" fill="#E6EDF3">配置</text>
    <text y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="16" fill="#8B949E">间隔 · 随机 · 轮数</text>
  </g>

  <!-- 步骤 3：开始 -->
  <g transform="translate(600 100)">
    <circle r="38" fill="#131B2A" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="27" cy="-27" r="13" fill="#FF7A1A"/>
    <text x="27" y="-22" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="15" font-weight="700" fill="#0C111B">3</text>
    <path d="M -7 -12 L 13 0 L -7 12 Z" fill="#FF7A1A" stroke-linejoin="round"/>
    <text y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="23" font-weight="700" fill="#E6EDF3">开始</text>
    <text y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="16" fill="#8B949E">GO 一键启动</text>
  </g>

  <!-- 步骤 4：循环点击 -->
  <g transform="translate(830 100)">
    <circle r="38" fill="#131B2A" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="27" cy="-27" r="13" fill="#FF7A1A"/>
    <text x="27" y="-22" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="15" font-weight="700" fill="#0C111B">4</text>
    <g fill="none" stroke="#FF7A1A" stroke-width="3.5" stroke-linecap="round">
      <path d="M -13 -2 A 13.5 13.5 0 0 1 13 -2"/>
      <path d="M 13 2 A 13.5 13.5 0 0 1 -13 2"/>
    </g>
    <path d="M 8.5 -3.5 L 17.5 -3.5 L 13 4.5 Z" fill="#FF7A1A"/>
    <path d="M -8.5 3.5 L -17.5 3.5 L -13 -4.5 Z" fill="#FF7A1A"/>
    <circle cx="0" cy="0" r="4" fill="#FF8A3D"/>
    <text y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="23" font-weight="700" fill="#E6EDF3">循环点击</text>
    <text y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="16" fill="#8B949E">按顺序轮流高亮</text>
  </g>

  <!-- 步骤 5：更新提醒 -->
  <g transform="translate(1060 100)">
    <circle r="38" fill="#131B2A" stroke="#FF7A1A" stroke-width="2.5"/>
    <circle cx="27" cy="-27" r="13" fill="#FF7A1A"/>
    <text x="27" y="-22" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="15" font-weight="700" fill="#0C111B">5</text>
    <path d="M -10 7 C -10 -7 -5 -12 0 -12 C 5 -12 10 -7 10 7 L 12.5 10 H -12.5 Z"
          fill="none" stroke="#FF7A1A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="14.5" r="2.8" fill="#FF7A1A"/>
    <text y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="23" font-weight="700" fill="#E6EDF3">更新提醒</text>
    <text y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="16" fill="#8B949E">检测新版自动推送</text>
  </g>
</svg>
