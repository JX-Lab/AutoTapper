    <circle cx="56" cy="39" r="7"/>
  </g>
  <g fill="#FFB067">
    <circle cx="27" cy="73" r="2.5"/>
    <circle cx="56" cy="39" r="2.5"/>
  </g>
  <circle cx="82" cy="57" r="16" fill="url(#glow)"/>
  <circle cx="82" cy="57" r="13" fill="#2B211D" stroke="#FF7A1A" stroke-opacity=".42" stroke-width="2"/>
  <circle cx="82" cy="57" r="8" fill="#101828" stroke="#FF8A3D" stroke-width="3"/>
  <circle cx="82" cy="57" r="3" fill="#fff"/>
  <path d="m46 75 8 5-7 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
